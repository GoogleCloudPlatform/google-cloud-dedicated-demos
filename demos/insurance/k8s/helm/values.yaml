global:
  universeDomain: "changeme"
  projectId: "changeme"
  region: "changeme"
  sqlInstanceName: "changeme"
  bucket: "changeme"
  iamDatabaseUser: "changeme"
  databaseName: "insurance_claims"


insuranceApp:
  image:
    repository: "changeme"
    tag: "latest"
  proxyImage: "changeme"
  pgImage: "changeme"
  gcloudImage: "changeme"
  serviceAccount:
    name: insurance-demo-ksa
    gcpServiceAccountEmail: "changeme"
  loginUser: "changeme"
  loginPassword: "changeme" # pragma: allowlist secret
  service:
    type: LoadBalancer
    port: 8080

jupyter:
  sqlDnsName: "changeme"
  rawPassword: "changeme" # pragma: allowlist secret
  image:
    repository: docker.io/jupyter/base-notebook
    tag: x86_64-ubuntu-22.04
    pullPolicy: IfNotPresent
  replicaCount: 1
  storageSize: 10Gi

vllm:
  replicaCount: 1
  gpuCount: 1
  image:
    repository: "vllm/vllm-openai"
    tag: "v0.22.0"
    pullPolicy: IfNotPresent
  modelName: "google/gemma-3-27b-it"
  huggingFaceToken: "changeme"
  service:
    type: LoadBalancer

dnsPolicy: None
dnsConfig:
  searches:
    - insurance-ns.svc.cluster.local
    - svc.cluster.local
    - cluster.local
  options:
    - name: ndots
      value: "5"
