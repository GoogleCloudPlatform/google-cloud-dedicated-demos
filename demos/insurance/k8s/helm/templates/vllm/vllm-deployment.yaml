---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-demo-vllm-gemma
  labels:
    app: vllm
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.vllm.replicaCount | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: gemma-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        ai.gke.io/inference-server: vllm
        ai.gke.io/model: {{ .Values.vllm.modelName | default "google/gemma-3-27b-it" | replace "/" "-" | quote }}
        app: gemma-server
    spec:
      containers:
        - args:
            - --model=$(MODEL_ID)
            - --tensor-parallel-size={{ .Values.vllm.gpuCount | default 1 }}
            - --host=0.0.0.0
            - --port=8000
            - --gpu-memory-utilization=0.95
            - --max-model-len=32768
            - --max-num-seqs=4
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
          env:
            - name: LD_LIBRARY_PATH
              value: ${LD_LIBRARY_PATH}:/usr/local/nvidia/lib64
            - name: MODEL_ID
              value: {{ .Values.vllm.modelName | default "google/gemma-3-27b-it" | quote }}
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-gemma-secret
                  key: huggingface-token
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          imagePullPolicy: {{ .Values.vllm.image.pullPolicy | default "IfNotPresent" }}
          name: inference-server
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              nvidia.com/gpu: "{{ .Values.vllm.gpuCount | default 1 }}"
            requests:
              cpu: "10"
              ephemeral-storage: 10Gi
              memory: 100Gi
              nvidia.com/gpu: "{{ .Values.vllm.gpuCount | default 1 }}"
          securityContext:
            capabilities:
              drop:
                - NET_RAW
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /root/.cache/huggingface
              name: cache-volume
      dnsPolicy: ClusterFirst
      nodeSelector:
        cloud.google.com/compute-class: a3-edgegpu-8g-nolssd
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir:
            medium: Memory
          name: dshm
        - name: cache-volume
          persistentVolumeClaim:
            claimName: model-cache
