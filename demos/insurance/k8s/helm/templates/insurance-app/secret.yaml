apiVersion: v1
kind: Secret
metadata:
  name: insurance-db-secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.insuranceApp.dbPassword | quote }}
  DATABASE_USER_NAME: {{ .Values.global.iamDatabaseUser | quote }}
  APP_LOGIN_USER: {{ .Values.insuranceApp.loginUser | quote }}
  APP_LOGIN_PASSWORD: {{ .Values.insuranceApp.loginPassword | quote }}
