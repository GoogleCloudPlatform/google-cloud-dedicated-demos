---
# Deployment for the Jupyter Notebook application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-demo-jupyter-notebook
  labels:
    app: jupyter
spec:
  replicas: {{ .Values.jupyter.replicaCount }}
  selector:
    matchLabels:
      app: jupyter
  template:
    metadata:
      labels:
        app: jupyter
    spec:
      serviceAccountName: insurance-demo-jupyter-ksa
      dnsPolicy: {{ .Values.dnsPolicy | default "ClusterFirst" }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      # Set fsGroup: 1000 to match the 'jovyan' user in the official Jupyter image
      securityContext:
        fsGroup: 1000

      # --- Init Container to copy the default notebook from ConfigMap to PVC ---
      initContainers:
        - name: copy-welcome-notebook
          image: busybox:1.36 # Placeholder updated via kubectl set image
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - >-
              cp /tmp/configmap-notebooks/health_insurance_risk_analysis.ipynb
              /home/jovyan/health_insurance_risk_analysis.ipynb &&
              chown 1000:100 /home/jovyan/health_insurance_risk_analysis.ipynb
          volumeMounts:
            # Mount the writable PVC where the final file needs to live
            - name: notebook-volume
              mountPath: /home/jovyan
            # Mount the read-only ConfigMap to a temporary location
            - name: configmap-notebooks-volume
              mountPath: /tmp/configmap-notebooks

      # --- Main Container ---
      containers:
        - name: jupyter-container
          image: "{{ .Values.jupyter.image.repository }}:{{ .Values.jupyter.image.tag }}"
          imagePullPolicy: {{ .Values.jupyter.image.pullPolicy }}
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /login
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: SERVING_LLM_HOST
              value: "llm-service"
            - name: SERVING_LLM_PORT
              value: "8000"
            - name: JUPYTER_RAW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jupyter-notebook-secret
                  key: jupyter-raw-password
            - name: PROJECT_ID
              value: {{ .Values.global.projectId | quote }}
            - name: REGION
              value: {{ .Values.global.region | quote }}
            - name: UNIVERSE_DOMAIN
              value: {{ .Values.global.universeDomain | quote }}
            - name: DATASET_ID
              value: "next_demo_health_insurance_ds"
            - name: CLAIMS_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: insurance-demo-secrets
                  key: CLAIMS_DATABASE_NAME
            - name: DATABASE_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: insurance-db-secrets
                  key: DATABASE_USER_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insurance-db-secrets
                  key: DB_PASSWORD
            - name: SQL_INSTANCE_NAME
              valueFrom:
                secretKeyRef:
                  name: insurance-demo-secrets
                  key: SQL_INSTANCE_NAME
            - name: CLAIMS_DOCUMENTS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: insurance-demo-secrets
                  key: CLAIMS_DOCUMENTS_BUCKET
            - name: SQL_DNS_NAME
              value: {{ .Values.jupyter.sqlDnsName | quote }}
          volumeMounts:
            - name: notebook-volume
              mountPath: /home/jovyan # The home directory for 'jovyan' user
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$JUPYTER_RAW_PASSWORD" ]; then
                echo "Error: JUPYTER_RAW_PASSWORD is not set"
                exit 1
              fi
              HASHED_PW=$(python3 -c "
              import os
              try:
                  from jupyter_server.auth import passwd
              except ImportError:
                  from notebook.auth import passwd
              print(passwd(os.environ['JUPYTER_RAW_PASSWORD']))
              ")
              exec start-notebook.sh \
                --NotebookApp.password="${HASHED_PW}" \
                --NotebookApp.token='' \
                --NotebookApp.trust_xheaders=True
      volumes:
        - name: notebook-volume
          persistentVolumeClaim:
            claimName: jupyter-notebook-pvc
        - name: configmap-notebooks-volume
          configMap:
            name: jupyter-notebooks
            items:
              - key: health_insurance_risk_analysis.ipynb
                path: health_insurance_risk_analysis.ipynb
