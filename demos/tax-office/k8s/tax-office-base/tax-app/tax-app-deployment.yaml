---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-office-app-deployment
  namespace: tax-office-ns
  labels:
    app: tax-office-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tax-office-app
  template:
    metadata:
      labels:
        app: tax-office-app
    spec:
      serviceAccountName: app-ksa
      containers:
        - name: tax-office-container
          # TODO: change it as parameter which should be potentially injected.
          image: >-
            docker.pkg-berlin-build0.goog/eu0/svr-bigquery-demo/tax-office-app-registry/tax-office-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
