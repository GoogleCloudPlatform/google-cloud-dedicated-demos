apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
data:
  LOCAL_ROUTING_NUM: {{ .Values.environment.localRoutingNum | quote }}
  PUB_KEY_PATH: "/tmp/.ssh/publickey"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-api-config
data:
  TRANSACTIONS_API_ADDR: "ledgerwriter:8080"
  BALANCES_API_ADDR: "balancereader:8080"
  HISTORY_API_ADDR: "transactionhistory:8080"
  CONTACTS_API_ADDR: "contacts:8080"
  USERSERVICE_API_ADDR: "userservice:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-data-config
data:
  USE_DEMO_DATA: "True"
  DEMO_LOGIN_USERNAME: "testuser"
  DEMO_LOGIN_PASSWORD: "bankofanthos" # pragma: allowlist secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-of-anthos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-db-config
data:
  ACCOUNTS_DB_URI: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-db-config
data:
  POSTGRES_DB: {{ .Values.database.name | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.user | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | quote }}
