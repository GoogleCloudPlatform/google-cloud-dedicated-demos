{{- if .Values.database.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  labels:
    application: bank-of-anthos
    environment: development
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        application: bank-of-anthos
        tier: db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:15-alpine
          command: ["/scripts/init.sh"]
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.database.password | quote }}
            - name: DB_ADMIN_USER
              value: {{ .Values.database.init.adminUser | quote }}
            - name: DB_ADMIN_PASSWORD
              value: {{ .Values.database.init.adminPassword | quote }}
            - name: IS_PRIMARY
              value: {{ .Values.database.init.isPrimary | quote }}
            - name: LOCAL_ROUTING_NUM
              value: {{ .Values.environment.localRoutingNum | quote }}
          volumeMounts:
            - name: scripts-volume
              mountPath: /scripts
      volumes:
        - name: scripts-volume
          configMap:
            name: db-init-scripts
            defaultMode: 0755
{{- end }}
