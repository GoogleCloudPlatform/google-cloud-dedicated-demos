grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: 'SovereignMonitoring'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      k8s-cluster-global:
        gnetId: 15757
        revision: 1
        datasource: Mimir
      beacon-demo-app:
        json: |
          {
            "annotations": {
              "list": []
            },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "id": null,
            "links": [],
            "liveNow": false,
            "panels": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "mimir-datasource"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "thresholds"
                    },
                    "mappings": [],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "blue",
                          "value": null
                        }
                      ]
                    },
                    "unit": "short"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 6,
                  "w": 6,
                  "x": 0,
                  "y": 0
                },
                "id": 1,
                "options": {
                  "colorMode": "value",
                  "graphMode": "area",
                  "justifyMode": "auto",
                  "orientation": "auto",
                  "reduceOptions": {
                    "calcs": ["lastNotNull"],
                    "fields": "",
                    "values": false
                  },
                  "textMode": "auto"
                },
                "pluginVersion": "10.0.0",
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "mimir-datasource"
                    },
                    "editorMode": "code",
                    "expr": "sum(beacon_push_alerts) OR vector(0)",
                    "instant": true,
                    "legendFormat": "Total Alerts Sent",
                    "range": false,
                    "refId": "A"
                  }
                ],
                "title": "Beacon Total Alerts Emitted",
                "type": "stat"
              },
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "mimir-datasource"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "palette-classic"
                    },
                    "custom": {
                      "hideFrom": {
                        "legend": false,
                        "tooltip": false,
                        "viz": false
                      }
                    },
                    "mappings": []
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 6,
                  "w": 6,
                  "x": 6,
                  "y": 0
                },
                "id": 2,
                "options": {
                  "legend": {
                    "displayMode": "list",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "pieType": "donut",
                  "reduceOptions": {
                    "calcs": ["lastNotNull"],
                    "fields": "",
                    "values": false
                  },
                  "tooltip": {
                    "mode": "single",
                    "sort": "none"
                  }
                },
                "pluginVersion": "10.0.0",
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "mimir-datasource"
                    },
                    "editorMode": "code",
                    "expr": "sum(increase(beacon_push_alerts[15m])) by (severity)",
                    "legendFormat": "{{severity}}",
                    "range": true,
                    "refId": "A"
                  }
                ],
                "title": "Alert Severity Ratio (Last 15m)",
                "type": "piechart"
              },
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "mimir-datasource"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "thresholds"
                    },
                    "mappings": [],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        }
                      ]
                    },
                    "unit": "short"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 6,
                  "w": 6,
                  "x": 12,
                  "y": 0
                },
                "id": 3,
                "options": {
                  "colorMode": "value",
                  "graphMode": "area",
                  "justifyMode": "auto",
                  "orientation": "auto",
                  "reduceOptions": {
                    "calcs": ["lastNotNull"],
                    "fields": "",
                    "values": false
                  },
                  "textMode": "auto"
                },
                "pluginVersion": "10.0.0",
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "mimir-datasource"
                    },
                    "editorMode": "code",
                    "expr": "sum(scrape_samples_scraped)",
                    "instant": true,
                    "legendFormat": "Active Metrics Ingested",
                    "range": false,
                    "refId": "A"
                  }
                ],
                "title": "Active Ingested Metrics (Mimir)",
                "type": "stat"
              },
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "mimir-datasource"
                },
                "fieldConfig": {
                  "defaults": {
                    "color": {
                      "mode": "palette-classic"
                    },
                    "custom": {
                      "axisBorderShow": false,
                      "axisCenteredZero": false,
                      "axisColorMode": "text",
                      "axisLabel": "alerts/sec",
                      "axisPlacement": "auto",
                      "barAlignment": 0,
                      "drawStyle": "line",
                      "fillOpacity": 10,
                      "gradientMode": "none",
                      "hideFrom": {
                        "legend": false,
                        "tooltip": false,
                        "viz": false
                      },
                      "lineInterpolation": "smooth",
                      "lineWidth": 2,
                      "pointSize": 5,
                      "scaleDistribution": {
                        "type": "linear"
                      },
                      "showPoints": "auto",
                      "spanNulls": false,
                      "stacking": {
                        "group": "A",
                        "mode": "none"
                      },
                      "thresholdsStyle": {
                        "mode": "off"
                      }
                    },
                    "mappings": [],
                    "unit": "ops"
                  },
                  "overrides": []
                },
                "gridPos": {
                  "h": 8,
                  "w": 18,
                  "x": 0,
                  "y": 6
                },
                "id": 4,
                "options": {
                  "legend": {
                    "calcs": [],
                    "displayMode": "list",
                    "placement": "bottom",
                    "showLegend": true
                  },
                  "tooltip": {
                    "mode": "single",
                    "sort": "none"
                  }
                },
                "pluginVersion": "10.0.0",
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "mimir-datasource"
                    },
                    "editorMode": "code",
                    "expr": "sum(rate(beacon_push_alerts[1m])) by (severity)",
                    "legendFormat": "{{severity}}",
                    "range": true,
                    "refId": "A"
                  }
                ],
                "title": "Beacon Alert Emission Rate (per sec)",
                "type": "timeseries"
              }
            ],
            "refresh": "5s",
            "schemaVersion": 38,
            "style": "dark",
            "tags": ["beacon", "demo", "monitoring", "apache-2.0"],
            "time": {
              "from": "now-15m",
              "to": "now"
            },
            "timepicker": {},
            "timezone": "browser",
            "title": "Beacon Demo App Observability",
            "uid": "beacon-demo-app",
            "version": 3
          }
