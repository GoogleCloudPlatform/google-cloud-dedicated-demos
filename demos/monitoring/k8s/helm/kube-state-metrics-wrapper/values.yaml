kube-state-metrics:
  enabled: true
  image:
    registry: "registry.k8s.io"
    repository: "kube-state-metrics/kube-state-metrics"
    tag: "v2.19.1"
    pullPolicy: IfNotPresent
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  serviceAccount:
    create: true
    name: "kube-state-metrics"
  rbac:
    create: true
