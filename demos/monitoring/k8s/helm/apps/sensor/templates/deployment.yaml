apiVersion: v1
kind: Service
metadata:
  name: monitoring-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    app: sensor-app
spec:
  selector:
    app: sensor-app
  ports:
    - name: metrics
      port: {{ .Values.sensor.port }}
      targetPort: metrics

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-sensor
  namespace: {{ .Release.Namespace }}
  labels:
    app: sensor-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-app
  template:
    metadata:
      labels:
        app: sensor-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.sensor.port }}"
        prometheus.io/path: "/metrics"
        prometheus.io/scheme: "https"
    spec:
      containers:
        - name: sensor
          image: {{ .Values.sensor.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: {{ .Values.sensor.port }}
          env:
            - name: PROMETHEUS_PORT
              value: "{{ .Values.sensor.port }}"
            - name: SENSOR_SSL_CERT_FILE
              value: /etc/ssl/certs/sovereign/tls.crt
            - name: SENSOR_SSL_KEY_FILE
              value: /etc/ssl/certs/sovereign/tls.key
            - name: SENSOR_SSL_CA_FILE
              value: /etc/ssl/certs/sovereign/ca.crt
            - name: SENSOR_CLIENT_AUTH
              value: "true"
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/ssl/certs/sovereign
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: sensor-tls-secret
