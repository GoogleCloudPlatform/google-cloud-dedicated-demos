apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-sensor-tls
  labels:
    app: sensor-app
spec:
  secretName: sensor-tls-secret
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  commonName: monitoring-sensor
  dnsNames:
    - monitoring-sensor
    - monitoring-sensor.{{ .Release.Namespace }}
    - monitoring-sensor.{{ .Release.Namespace }}.svc
    - monitoring-sensor.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    name: sovereign-monitoring-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
