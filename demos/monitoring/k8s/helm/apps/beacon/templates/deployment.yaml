apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-beacon
  labels:
    app: beacon-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-app
  template:
    metadata:
      labels:
        app: beacon-app
    spec:
      containers:
        - name: beacon
          image: {{ .Values.beacon.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_COLLECTOR_ENDPOINT
              value: {{ .Values.beacon.otelHttpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/ssl/certs/sovereign/ca.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
              value: /etc/ssl/certs/sovereign/tls.crt
            - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
              value: /etc/ssl/certs/sovereign/tls.key
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/ssl/certs/sovereign
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: tls-certs
          secret:
            secretName: beacon-tls-secret