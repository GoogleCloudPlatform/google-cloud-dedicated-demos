mimir-distributed:
  enabled: true
  image:
    repository: docker.io/grafana/mimir

  global:
    extraEnv:
      - name: GOOGLE_CLOUD_UNIVERSE_DOMAIN
        value: replaceme

  serviceAccount:
    name: mimir-ksa
    annotations:
      iam.gke.io/gcp-service-account: replaceme

  mimir:
    singleBinary:
      replicas: 1
    structuredConfig:
      usage_stats:
        enabled: false
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      common:
        storage:
          backend: gcs
          gcs:
            bucket_name: replaceme
      blocks_storage:
        backend: gcs
        storage_prefix: mimirBlocks
      ruler_storage:
        backend: gcs
        storage_prefix: mimirRuler
      store_gateway:
        sharding_ring:
          replication_factor: 1

  gateway:
    enabled: true
    persistentVolume:
      size: 10Gi

  ruler:
    enabled: true
    persistentVolume:
      size: 10Gi

  distributor:
    enabled: true

  ingester:
    enabled: true
    replicas: 1
    persistentVolume:
      size: 10Gi
    zoneAwareReplication:
      enabled: false

  compactor:
    enabled: true
    persistentVolume:
      size: 10Gi

  store_gateway:
    enabled: true
    persistentVolume:
      size: 10Gi
    zoneAwareReplication:
      enabled: false

  alertmanager:
    enabled: false

  minio:
    enabled: false

  metaMonitoring:
    serviceMonitor:
      clusterLabel: null
