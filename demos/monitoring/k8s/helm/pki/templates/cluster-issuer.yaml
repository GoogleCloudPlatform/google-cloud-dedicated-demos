apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.pki.bootstrapIssuer.name }}
  labels:
    app.kubernetes.io/name: pki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.pki.rootCA.name }}
  namespace: {{ .Values.pki.rootCA.namespace }}
  labels:
    app.kubernetes.io/name: pki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  isCA: true
  commonName: {{ .Values.pki.rootCA.commonName }}
  secretName: {{ .Values.pki.rootCA.secretName }}
  privateKey:
    algorithm: {{ .Values.pki.rootCA.algorithm }}
    size: {{ .Values.pki.rootCA.size }}
  issuerRef:
    name: {{ .Values.pki.bootstrapIssuer.name }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.pki.caIssuer.name }}
  labels:
    app.kubernetes.io/name: pki
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ca:
    secretName: {{ .Values.pki.rootCA.secretName }}
