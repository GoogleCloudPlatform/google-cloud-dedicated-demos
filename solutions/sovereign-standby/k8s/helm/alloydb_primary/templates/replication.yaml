{{- if .Values.replication.enabled }}
apiVersion: alloydbomni.dbadmin.goog/v1
kind: Replication
metadata:
  name: {{ .Values.dbCluster.name }}-replication
  namespace: {{ .Release.Namespace }}
spec:
  dbcluster:
    name: {{ .Values.dbCluster.name }}
  upstream:
    username: {{ .Values.replication.username | default "repl_user" }}
    replicationSlotName: {{ .Values.replication.slotName | default "alloydb_repl_slot" }}
    logReplicationSlot: true
    password:
      name: alloydb-repl-password
{{- end }}
