apiVersion: batch/v1
kind: Job
metadata:
  name: cloudsql-setup-job
  labels:
    application: bank-of-anthos
spec:
  template:
    metadata:
      labels:
        application: bank-of-anthos
        tier: cloudsql-setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cloudsql-setup
          image: postgres:15-alpine
          command: ["/scripts/setup.sh"]
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: PRIMARY_DB_HOST
              value: {{ .Values.database.primaryHost | quote }}
            - name: DB_ADMIN_USER
              value: {{ .Values.database.adminUser | quote }}
            - name: DB_ADMIN_PASSWORD
              value: {{ .Values.database.adminPassword | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.database.password | quote }}
            - name: IS_PRIMARY
              value: {{ .Values.database.isPrimary | quote }}
          volumeMounts:
            - name: scripts-volume
              mountPath: /scripts
      volumes:
        - name: scripts-volume
          configMap:
            name: cloudsql-setup-scripts
            defaultMode: 0755
