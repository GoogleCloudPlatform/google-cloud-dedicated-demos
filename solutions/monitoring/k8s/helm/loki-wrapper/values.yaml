loki:
  enabled: true
  deploymentMode: SimpleScalable

  global:
    extraEnv:
      - name: GOOGLE_CLOUD_UNIVERSE_DOMAIN
        value: replaceme

  serviceAccount:
    create: true
    name: loki-ksa
    annotations:
      iam.gke.io/gcp-service-account: replaceme

  loki:
    auth_enabled: true
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: gcs
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: gcs
      storage_prefix: loki
      bucketNames:
        chunks: replaceme
        ruler: replaceme
        admin: replaceme
      gcs:
        bucket_name: replaceme

    structuredConfig:
      server:
        log_level: debug
      ruler:
        enable_api: true
        rule_path: /tmp/loki/rules

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 336h
      allow_structured_metadata: true
      otlp_config:
        resource_attributes:
          attributes_config:
            - action: index_label
              attributes:
                - service.name
                - service.namespace
                - k8s.namespace.name
                - k8s.pod.name
                - k8s.container.name
                - app
                - job

    server:
      grpc_server_max_recv_msg_size: 104857600
      grpc_server_max_send_msg_size: 104857600

    querier:
      max_concurrent: 4

    frontend:
      grpc_client_config:
        max_send_msg_size: 104857600

    frontend_worker:
      grpc_client_config:
        max_send_msg_size: 104857600

  # Scalable microservice pods
  write:
    replicas: 1
    persistence:
      size: 10Gi
    affinity: {}
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi

  read:
    replicas: 1
    persistence:
      size: 10Gi
    affinity: {}
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi

  backend:
    replicas: 1
    persistence:
      size: 20Gi
    affinity: {}
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi

  gateway:
    enabled: true
    replicas: 1
    verboseLogging: true
    containerPort: 8080
    affinity: {}
    service:
      type: LoadBalancer
      loadBalancerIP: replaceme
      annotations:
        networking.gke.io/load-balancer-type: "Internal"
      port: 443
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # Disable Minio, enterprise license, canary, sidecars and external operators for demo simplicity
  sidecar:
    rules:
      enabled: true

  minio:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
      metricsInstance:
        enabled: false
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false
