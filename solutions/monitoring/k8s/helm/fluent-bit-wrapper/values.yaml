fluent-bit:
  enabled: true
  kind: DaemonSet

  testFramework:
    enabled: false

  serviceAccount:
    create: true
    name: fluent-bit-ksa

  rbac:
    create: true
    nodeAccess: false
    eventsAccess: false

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  extraVolumes:
    - name: fluent-bit-certs
      secret:
        secretName: fluent-bit-tls-secret

  extraVolumeMounts:
    - name: fluent-bit-certs
      mountPath: /etc/fluent-bit/certs
      readOnly: true

  env:
    - name: OTEL_COLLECTOR_HOST
      value: collector-with-ta-collector

  daemonSetVolumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: data
      emptyDir: {}

  daemonSetVolumeMounts:
    - name: varlog
      mountPath: /var/log
      readOnly: true
    - name: data
      mountPath: /var/fluent-bit

  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  config:
    service: |
      [SERVICE]
          Daemon          Off
          Flush           1
          Log_Level       info
          Parsers_File    /fluent-bit/etc/parsers.conf
          HTTP_Server     On
          HTTP_Listen     0.0.0.0
          HTTP_Port       2020
          Health_Check    On

    inputs: |
      [INPUT]
          Name              tail
          Tag               kube.*
          Path              /var/log/containers/*.log
          multiline.parser  docker, cri
          DB                /var/fluent-bit/flb_kube.db
          Mem_Buf_Limit     50MB
          Skip_Long_Lines   On
          Refresh_Interval  10

    filters: |
      [FILTER]
          Name                kubernetes
          Match               kube.*
          Kube_URL            https://kubernetes.default.svc:443
          Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
          Kube_Tag_Prefix     kube.var.log.containers.
          Merge_Log           On
          Merge_Log_Key       log_processed
          Keep_Log            On
          K8S-Logging.Parser  On
          K8S-Logging.Exclude On

    outputs: |
      [OUTPUT]
          Name                      opentelemetry
          Match                     kube.*
          Host                      ${OTEL_COLLECTOR_HOST}
          Port                      4318
          Logs_uri                  /v1/logs
          Logs_Body_Key             log
          Logs_Body_Key_Attributes  On
          Log_response_payload      True
          tls                       On
          tls.verify                On
          tls.ca_file               /etc/fluent-bit/certs/ca.crt
          tls.crt_file              /etc/fluent-bit/certs/tls.crt
          tls.key_file              /etc/fluent-bit/certs/tls.key
