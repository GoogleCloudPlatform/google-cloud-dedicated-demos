{{- if .Values.collector.enabled }}
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: collector-with-ta
  namespace: {{ .Release.Namespace }}
spec:
  mode: statefulset
  replicas: 2
  serviceAccount: otel-ksa

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  targetAllocator:
    enabled: true
    prometheusCR:
      enabled: true
      serviceMonitorSelector:
        matchLabels:
          release: monitoring
      podMonitorSelector:
        matchLabels:
          release: monitoring
  volumes:
    - name: otel-collector-tls
      secret:
        secretName: otel-collector-tls-secret
  volumeMounts:
    - name: otel-collector-tls
      mountPath: /etc/otel/certs
      readOnly: true

  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
              client_ca_file: /etc/otel/certs/ca.crt
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /etc/otel/certs/tls.crt
              key_file: /etc/otel/certs/tls.key
              client_ca_file: /etc/otel/certs/ca.crt

      prometheus:
        config:
          scrape_configs:
          # Since kubernetes-cadvisor runs directly on nodes, without creating Service, metrics can't be scraped using TA + ServiceMonitor.
          # Therefore it needs to be configured here.
          - job_name: 'kubernetes-cadvisor'
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
            metrics_path: /metrics/cadvisor
            relabel_configs:
              - action: replace
                replacement: 10250
                source_labels: [__meta_kubernetes_node_address_InternalIP]
                target_label: __address__
                regex: (.*)
                replacement: ${1}:10250
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
            metric_relabel_configs:
              - target_label: service
                replacement: kube-prometheus-stack-kubelet

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # Merge map body into attributes if body is a Map
              - merge_maps(attributes, body, "insert") where IsMap(body)
              # Set string body from log field if body is Map
              - set(body, attributes["log"]) where IsMap(body) and attributes["log"] != nil
              # Extract k8s metadata from attributes into flat record attributes
              - set(attributes["k8s.namespace.name"], attributes["kubernetes"]["namespace_name"]) where attributes["kubernetes"]["namespace_name"] != nil
              - set(attributes["k8s.pod.name"], attributes["kubernetes"]["pod_name"]) where attributes["kubernetes"]["pod_name"] != nil
              - set(attributes["k8s.container.name"], attributes["kubernetes"]["container_name"]) where attributes["kubernetes"]["container_name"] != nil
              - set(attributes["k8s.node.name"], attributes["kubernetes"]["host"]) where attributes["kubernetes"]["host"] != nil
              - set(attributes["app"], attributes["kubernetes"]["labels"]["app.kubernetes.io/name"]) where attributes["kubernetes"]["labels"]["app.kubernetes.io/name"] != nil
              - set(attributes["app"], attributes["kubernetes"]["labels"]["app"]) where attributes["kubernetes"]["labels"]["app"] != nil and attributes["app"] == nil
              - set(attributes["service.name"], attributes["kubernetes"]["labels"]["app.kubernetes.io/name"]) where attributes["kubernetes"]["labels"]["app.kubernetes.io/name"] != nil
              - set(attributes["service.name"], attributes["kubernetes"]["labels"]["app"]) where attributes["kubernetes"]["labels"]["app"] != nil and attributes["service.name"] == nil
              - set(attributes["service.name"], attributes["kubernetes"]["container_name"]) where attributes["service.name"] == nil and attributes["kubernetes"]["container_name"] != nil
              - set(attributes["service.namespace"], attributes["kubernetes"]["namespace_name"]) where attributes["kubernetes"]["namespace_name"] != nil
              # Fallbacks for missing pod metadata
              - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil and attributes["k8s.container.name"] != nil
              - set(attributes["service.name"], attributes["app"]) where attributes["service.name"] == nil and attributes["app"] != nil
              - set(attributes["service.name"], "system") where attributes["service.name"] == nil or attributes["service.name"] == "unknown_service"
              # Overwrite resource attributes directly
              - set(resource.attributes["service.name"], attributes["service.name"]) where attributes["service.name"] != nil
              - set(resource.attributes["service.namespace"], attributes["service.namespace"]) where attributes["service.namespace"] != nil
              - set(resource.attributes["k8s.namespace.name"], attributes["k8s.namespace.name"]) where attributes["k8s.namespace.name"] != nil
              - set(resource.attributes["k8s.pod.name"], attributes["k8s.pod.name"]) where attributes["k8s.pod.name"] != nil
              - set(resource.attributes["k8s.container.name"], attributes["k8s.container.name"]) where attributes["k8s.container.name"] != nil
              - set(resource.attributes["k8s.node.name"], attributes["k8s.node.name"]) where attributes["k8s.node.name"] != nil
              - set(resource.attributes["app"], attributes["app"]) where attributes["app"] != nil
      groupbyattrs:
        keys:
          - service.name
          - service.namespace
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - app
    exporters:
      debug: {}
      otlphttp/loki:
        endpoint: https://loki-gateway.{{ .Release.Namespace }}.svc.cluster.local:443/otlp
        headers:
          X-Scope-OrgID: "demo"
        tls:
          ca_file: /etc/otel/certs/ca.crt
          cert_file: /etc/otel/certs/tls.crt
          key_file: /etc/otel/certs/tls.key
          insecure: false
      otlphttp/mimir:
        endpoint: https://mimir-gateway.{{ .Release.Namespace }}.svc.cluster.local:443/otlp
        headers:
          X-Scope-OrgID: "demo"
        tls:
          ca_file: /etc/otel/certs/ca.crt
          cert_file: /etc/otel/certs/tls.crt
          key_file: /etc/otel/certs/tls.key
          insecure: false

    service:
      extensions:
        - health_check
      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - transform
            - groupbyattrs
            - batch
          exporters:
            - debug
            - otlphttp/loki
        metrics:
          receivers:
            - otlp
            - prometheus
          processors:
            - batch
          exporters:
            - debug
            - otlphttp/mimir
{{- end }}

