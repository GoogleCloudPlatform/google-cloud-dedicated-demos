global:
  projectId: "changeme"
  universeDomain: "changeme"
  region: "changeme"

jupyter:
  rawPassword: "changeme" # pragma: allowlist secret
  image:
    repository: docker.io/jupyter/base-notebook
    tag: x86_64-ubuntu-22.04
    pullPolicy: IfNotPresent
  replicaCount: 1
  storageSize: 10Gi

taxApp:
  image:
    repository: changeme
    tag: latest
    pullPolicy: Always
  replicaCount: 3
  flaskSecretKey: changeme # pragma: allowlist secret
  demoPassword: changeme # pragma: allowlist secret
  demoUsername: changeme

llm:
  defaultBackend: "vertex"

vertexAI:
  projectId: "changeme"
  region: "changeme"
  endpointId: "changeme"

vllm:
  enabled: true
  modelId: "google/gemma-3-27b-it"
  replicaCount: 1
  image:
    repository: docker.io/vllm/vllm-openai
    tag: v0.10.0
    pullPolicy: IfNotPresent
  storageSize: 256Gi
  gpuCount: 1
  huggingFaceToken: changeme # pragma: allowlist secret
  computeClass:
    enabled: true
    name: cc-a3-highgpu-1g
    machineType: a3-highgpu-1g-nolssd
    gpuCount: 1
    gpuType: nvidia-h100-80gb
    zones:
      - changeme
  nodeSelector: {}
  tolerations: []

dnsPolicy: None
dnsConfig:
  searches:
    - tax-office-ns.svc.cluster.local
    - svc.cluster.local
    - cluster.local
  options:
    - name: ndots
      value: "5"
