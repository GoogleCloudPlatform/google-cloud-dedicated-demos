---
apiVersion: v1
kind: Secret
metadata:
  name: tax-office-app-secret
  labels:
    {{- include "tax-office.taxApp.labels" . | nindent 4 }}
type: Opaque
data:
  flask-secret-key: {{ .Values.taxApp.flaskSecretKey | b64enc | quote }}
  demo-password: {{ .Values.taxApp.demoPassword | b64enc | quote }}
  demo-username: {{ .Values.taxApp.demoUsername | b64enc | quote }}
