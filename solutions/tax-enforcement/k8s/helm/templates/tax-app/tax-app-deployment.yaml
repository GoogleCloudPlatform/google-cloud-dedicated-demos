---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-office-app-deployment
  labels:
    {{- include "tax-office.taxApp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.taxApp.replicaCount }}
  selector:
    matchLabels:
      {{- include "tax-office.taxApp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tax-office.taxApp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: app-ksa
      dnsPolicy: {{ .Values.dnsPolicy | default "ClusterFirst" }}
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      containers:
        - name: tax-office-container
          image: "{{ .Values.taxApp.image.repository }}:{{ .Values.taxApp.image.tag }}"
          imagePullPolicy: {{ .Values.taxApp.image.pullPolicy }}
          ports:
            - containerPort: 5001
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tax-office-app-secret
                  key: flask-secret-key
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tax-office-app-secret
                  key: demo-password
            - name: DEMO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tax-office-app-secret
                  key: demo-username
            - name: PROJECT_ID
              value: {{ .Values.global.projectId }}
            - name: UNIVERSE_DOMAIN
              value: {{ .Values.global.universeDomain }}
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
