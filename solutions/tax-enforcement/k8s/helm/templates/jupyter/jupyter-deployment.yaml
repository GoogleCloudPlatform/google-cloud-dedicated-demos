---
# Deployment for the Jupyter Notebook application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-notebook
  labels:
    {{- include "tax-office.jupyter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.jupyter.replicaCount }}
  selector:
    matchLabels:
      {{- include "tax-office.jupyter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tax-office.jupyter.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: jupyter-notebook-ksa
      # Set fsGroup: 1000 to match the 'jovyan' user in the official Jupyter
      # image
      securityContext:
        fsGroup: 1000

      # --- Init Container to copy the default notebook(anomaly_detector.ipynb)
      # from ConfigMap to PVC ---
      initContainers:
        - name: copy-welcome-notebook
          image: busybox:1.36
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
          command:
            - sh
            - -c
            - >-
              cp /tmp/configmap-notebooks/anomaly_detector.ipynb
              /home/jovyan/anomaly_detector.ipynb &&
              chown 1000:100 /home/jovyan/anomaly_detector.ipynb
          volumeMounts:
            # Mount the writable PVC where the final file needs to live
            - name: notebook-volume
              mountPath: /home/jovyan
            # Mount the read-only ConfigMap to a temporary location
            - name: configmap-notebooks-volume
              mountPath: /tmp/configmap-notebooks

      # --- Main Container ---
      containers:
        - name: jupyter-container
          image: "{{ .Values.jupyter.image.repository }}:{{ .Values.jupyter.image.tag }}"
          imagePullPolicy: {{ .Values.jupyter.image.pullPolicy }}
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /login
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
            - name: JUPYTER_RAW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jupyter-notebook-secret
                  key: jupyter-raw-password

          volumeMounts:
            - name: notebook-volume
              mountPath: /home/jovyan  # The home directory for 'jovyan' user
          command: ["sh", "-c"]
          args:
            - |
              if [ -z "$JUPYTER_RAW_PASSWORD" ]; then
                echo "Error: JUPYTER_RAW_PASSWORD is not set"
                exit 1
              fi
              HASHED_PW=$(python3 -c "
              import os
              try:
                  from jupyter_server.auth import passwd
              except ImportError:
                  from notebook.auth import passwd
              print(passwd(os.environ['JUPYTER_RAW_PASSWORD']))
              ")
              exec start-notebook.sh \
                --NotebookApp.password="${HASHED_PW}" \
                --NotebookApp.token='' \
                --NotebookApp.trust_xheaders=True

      volumes:
        - name: notebook-volume
          persistentVolumeClaim:
            claimName: jupyter-notebook-pvc
        - name: configmap-notebooks-volume
          configMap:
            name: jupyter-notebooks
            items:
              - key: anomaly_detector.ipynb
                path: anomaly_detector.ipynb
